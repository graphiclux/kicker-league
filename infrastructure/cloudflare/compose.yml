name: aing-cloudflare

services:
  cloudflared:
    image: cloudflare/cloudflared:2026.8.2
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    init: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks:
      - aing_default

networks:
  aing_default:
    external: true
